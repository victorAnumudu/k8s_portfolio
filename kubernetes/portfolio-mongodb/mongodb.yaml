
apiVersion: v1
kind: Service
metadata:
  name: portfolio-mongodb
  namespace: portfolio
spec:
  selector:
    app: portfolio-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: portfolio-mongodb
  namespace: portfolio
spec:
  serviceName: portfolio-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-mongodb
  template:
    metadata:
      labels:
        app: portfolio-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: portfolio-mongodb-auth
                  key: username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portfolio-mongodb-auth
                  key: password
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
