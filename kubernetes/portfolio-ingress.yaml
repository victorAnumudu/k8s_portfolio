apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfolio
  namespace: portfolio
spec:
  entryPoints:
    - web
  routes:
    # 1. API Route
    - match: (Host(`portfolio.local`) || Host(`backoffice.portfolio.local`)) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      middlewares:
        - name: portfolio-api-strip-prefix
      services:
        - name: portfolio-backend
          port: 10000

    # 2. Main Frontend Route
    - match: Host(`portfolio.local`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: portfolio-frontend
          port: 80

    # 3. Backoffice Frontend Route (Dedicated Subdomain)
    - match: Host(`backoffice.portfolio.local`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: portfolio-frontend-backoffice
          port: 80 # Update if your container uses a different port
